name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deployment at a time; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        # Project pages are served from /<repo>, so the app needs the base path
        # baked in at build time.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Repository *variables*, not secrets: every one of these reaches the
          # client bundle by design. They are kept out of the source tree only
          # so a public repository does not advertise them in plain text.
          NEXT_PUBLIC_PHONE_PT: ${{ vars.NEXT_PUBLIC_PHONE_PT }}
          NEXT_PUBLIC_PHONE_BR: ${{ vars.NEXT_PUBLIC_PHONE_BR }}
          NEXT_PUBLIC_WHATSAPP: ${{ vars.NEXT_PUBLIC_WHATSAPP }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
